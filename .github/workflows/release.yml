name: Release

# Builds the plugin, publishes a GitHub release, and adds it to manifest.json so Jellyfin can install it.
# Runs when you press "Run workflow" (Actions tab), and every day to pick up new YoutubeExplode versions on its own.
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: What changed in this release
        required: true
        default: Bug fixes and improvements.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Decide whether to release
        id: plan
        env:
          CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            CHANGELOG="$(python3 .github/scripts/release.py check-youtubeexplode)"
          fi
          if [ -z "$CHANGELOG" ]; then
            echo "YoutubeExplode is current, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "release=true"
            echo "version=$(python3 .github/scripts/release.py next-version)"
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # A failing test or build stops the release, and GitHub emails you about the failed run.
      - name: Test
        if: steps.plan.outputs.release == 'true'
        run: dotnet test

      - name: Build and package
        if: steps.plan.outputs.release == 'true'
        run: |
          V=${{ steps.plan.outputs.version }}
          dotnet build Jellyfin.Plugin.JellyTheme -c Release -p:Version=$V -p:AssemblyVersion=$V -p:FileVersion=$V
          cd Jellyfin.Plugin.JellyTheme/bin/Release/net10.0
          zip "$GITHUB_WORKSPACE/jellytheme_$V.zip" Jellyfin.Plugin.JellyTheme.dll YoutubeExplode.dll

      - name: Publish release and update manifest
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ steps.plan.outputs.changelog }}
        run: |
          V=${{ steps.plan.outputs.version }}
          ZIP="jellytheme_$V.zip"
          gh release create "v$V" "$ZIP" --title "JellyTheme $V" --notes "$CHANGELOG"
          python3 .github/scripts/release.py add-version "$V" "$ZIP" \
            "https://github.com/${{ github.repository }}/releases/download/v$V/$ZIP" "$CHANGELOG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json Jellyfin.Plugin.JellyTheme/Jellyfin.Plugin.JellyTheme.csproj
          git commit -m "Release $V"
          git push
