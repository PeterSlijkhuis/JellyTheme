<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>JellyTheme</title>
</head>
<body>
<div id="JellyThemePage" data-role="page" class="page type-interior pluginConfigurationPage" data-title="JellyTheme">
    <style>
        #JellyThemePage .jt-muted { opacity: .7; }
        #JellyThemePage .jt-toolbar { display: flex; gap: 1em; flex-wrap: wrap; align-items: center; margin: 1em 0; }
        #JellyThemePage .jt-toolbar > .inputContainer, #JellyThemePage .jt-toolbar > .selectContainer { margin: 0; }
        #JellyThemePage .jt-grow { flex: 1; min-width: 12em; }
        #JellyThemePage .jt-card { display: flex; gap: 1em; padding: 1em; margin-bottom: 1em; border-radius: .4em; background: rgba(128, 128, 128, .12); }
        #JellyThemePage .jt-poster { width: 4.5em; height: 6.75em; flex: none; border-radius: .3em; object-fit: cover; background: rgba(128, 128, 128, .2); }
        #JellyThemePage .jt-body { flex: 1; min-width: 0; }
        #JellyThemePage .jt-title { margin: 0 0 .1em; font-size: 1.15em; }
        #JellyThemePage .jt-title a { color: inherit; text-decoration: none; }
        #JellyThemePage .jt-title a:hover { text-decoration: underline; }
        #JellyThemePage .jt-row { display: flex; gap: .5em; flex-wrap: wrap; align-items: center; }
        #JellyThemePage .jt-search { margin-top: .6em; }
        #JellyThemePage .jt-search input, #JellyThemePage .jt-message input { flex: 1; min-width: 12em; }
        #JellyThemePage .jt-result { display: flex; gap: .75em; align-items: center; padding: .5em 0; border-top: 1px solid rgba(128, 128, 128, .2); }
        #JellyThemePage .jt-result:first-child { margin-top: .6em; }
        #JellyThemePage .jt-result.jt-playing { background: rgba(0, 164, 220, .12); }
        #JellyThemePage .jt-info { flex: 1; min-width: 0; }
        #JellyThemePage .jt-info > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #JellyThemePage .jt-badge { display: inline-block; margin-left: .5em; padding: 0 .5em; border-radius: 1em; font-size: .8em; background: #00a4dc; color: #fff; vertical-align: middle; }
        #JellyThemePage .jt-play { min-width: 6.5em; margin: 0; }
        #JellyThemePage .jt-use { margin: 0; }
        #JellyThemePage .jt-message { margin: .6em 0 0; }
        #JellyThemePage .jt-message a { color: #00a4dc; }
        #JellyThemePage .jt-keywords { margin-top: .4em; font-size: .9em; }
        #JellyThemePage .jt-keywords .emby-button { margin: 0; padding: .2em .8em; border-radius: 1em; font-size: .9em; }
        @media (max-width: 40em) {
            #JellyThemePage .jt-poster { display: none; }
            #JellyThemePage .jt-result { flex-wrap: wrap; }
            #JellyThemePage .jt-info { flex-basis: calc(100% - 8em); }
        }
    </style>
    <div data-role="content">
        <div class="content-primary">
            <h2 class="sectionTitle">Missing themes</h2>
            <p class="jt-muted">These movies, shows and collections have no theme yet, and none was found on Plex or ThemerrDB. Press <b>Find themes</b>, play the results, and press <b>Use this</b> on the right one. Nothing is saved until you do. To change a theme you already have, set <b>Items</b> to <b>All</b>.</p>
            <div class="jt-toolbar">
                <div class="inputContainer jt-grow">
                    <input is="emby-input" id="jtFilter" type="search" label="Filter by name" autocomplete="off">
                </div>
                <div class="selectContainer">
                    <select is="emby-select" id="jtScope" label="Items">
                        <option value="">Without a theme</option>
                        <option value="all">All, to replace a theme</option>
                    </select>
                </div>
                <div class="selectContainer">
                    <select is="emby-select" id="jtType" label="Show">
                        <option value="">Everything</option>
                        <option value="Movie">Movies</option>
                        <option value="Series">Shows</option>
                        <option value="Collection">Collections</option>
                    </select>
                </div>
                <div class="selectContainer">
                    <select is="emby-select" id="jtSort" label="Sort by">
                        <option value="name">Name</option>
                        <option value="added">Recently added</option>
                        <option value="newest">Year, newest first</option>
                        <option value="oldest">Year, oldest first</option>
                    </select>
                </div>
            </div>
            <p id="jtStatus" class="jt-muted">Loading...</p>
            <div id="jtList"></div>
            <button is="emby-button" id="jtMore" type="button" class="raised emby-button" style="display:none">Show more</button>
        </div>
    </div>
    <script type="text/javascript">
        (function () {
            const page = document.querySelector('#JellyThemePage');
            const filter = page.querySelector('#jtFilter');
            const type = page.querySelector('#jtType');
            const sort = page.querySelector('#jtSort');
            const scope = page.querySelector('#jtScope');
            const status = page.querySelector('#jtStatus');
            const list = page.querySelector('#jtList');
            const more = page.querySelector('#jtMore');
            const PAGE_SIZE = 50;
            let items = [];
            let limit = PAGE_SIZE;

            // One player for the whole page, so only one preview can ever play at a time.
            const player = new Audio();
            let current = null; // { button, row, note } of the result that owns the player

            // Builds elements with textContent only, so YouTube titles can never inject markup.
            function el(tag, props, ...children) {
                const e = document.createElement(tag);
                Object.assign(e, props);
                e.append(...children);
                return e;
            }

            function api(path, params) {
                return ApiClient.getUrl('JellyTheme/' + path, params);
            }

            function button(text, className) {
                const b = el('button', { type: 'button', className: 'raised emby-button ' + (className || ''), textContent: text });
                b.setAttribute('is', 'emby-button');
                return b;
            }

            function clock(seconds) {
                const s = Math.round(seconds || 0);
                return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
            }

            function needed(count) {
                return count + (count === 1 ? ' item needs' : ' items need') + ' a theme';
            }

            function label(item) {
                // Unmatched items are often named "Title (2001)" already; don't show the year twice.
                const year = item.Year && item.Type !== 'Collection' && !item.Name.endsWith('(' + item.Year + ')') ? ' (' + item.Year + ')' : '';
                return item.Name + year;
            }

            function stop() {
                player.pause();
                player.removeAttribute('src');
                player.load();
                if (current) {
                    current.button.textContent = 'Play';
                    current.row.classList.remove('jt-playing');
                    current = null;
                }
            }

            player.addEventListener('waiting', () => current && (current.button.textContent = 'Loading...'));
            player.addEventListener('playing', () => current && (current.button.textContent = 'Stop'));
            player.addEventListener('timeupdate', () => current && !player.paused && (current.button.textContent = 'Stop ' + clock(player.currentTime)));
            player.addEventListener('ended', stop);
            player.addEventListener('error', () => {
                if (current && player.getAttribute('src')) {
                    current.note.textContent = 'This preview could not play. The video may be over 30 minutes long or unavailable.';
                    stop();
                }
            });

            // The server sends them sorted by name; the other orders keep name order on ties.
            const orders = {
                name: () => 0,
                added: (a, b) => (b.Added || '').localeCompare(a.Added || ''),
                newest: (a, b) => (b.Year || 0) - (a.Year || 0),
                oldest: (a, b) => (a.Year || 9999) - (b.Year || 9999)
            };

            function visible() {
                const text = filter.value.toLowerCase();
                return items.filter(i => (!type.value || i.Type === type.value) && i.Name.toLowerCase().includes(text))
                    .sort(orders[sort.value]);
            }

            // One tap swaps the last words of the search. "soundtrack" finds more, but also full-album uploads, so it isn't the default.
            const KEYWORDS = ['main theme', 'theme song', 'soundtrack', 'opening', 'intro'];

            function withKeyword(query, keyword) {
                let base = query.trim();
                const lower = base.toLowerCase();
                const old = KEYWORDS.find(k => lower.endsWith(' ' + k));
                if (old) {
                    base = base.slice(0, -old.length).trim();
                }
                return base + ' ' + keyword;
            }

            const kinds = { Movie: 'Movie', Series: 'Show', Collection: 'Collection' };

            function render() {
                stop();
                const shown = visible();
                if (scope.value) {
                    status.textContent = shown.length + (shown.length === 1 ? ' item' : ' items') + '. Ones that already have a theme say so; picking a new one replaces it.';
                } else if (!items.length) {
                    status.textContent = 'Everything has a theme. New movies and shows are handled automatically when they are added.';
                } else if (!shown.length) {
                    status.textContent = 'Nothing matches this filter. ' + needed(items.length) + ' in total.';
                } else {
                    status.textContent = shown.length === items.length
                        ? needed(items.length)
                        : shown.length + ' of ' + items.length + ' items match';
                }
                list.replaceChildren(...shown.slice(0, limit).map(card));
                updateMore(shown.length);
            }

            function updateMore(total) {
                // Not the hidden attribute: Jellyfin's button style overrides it.
                more.style.display = total <= limit ? 'none' : '';
                more.textContent = 'Show more (' + (total - limit) + ' left)';
            }

            function card(item) {
                const poster = el('img', {
                    className: 'jt-poster',
                    alt: '',
                    loading: 'lazy',
                    src: ApiClient.getImageUrl(item.Id, { type: 'Primary', maxHeight: 200 })
                });
                poster.addEventListener('error', () => poster.replaceWith(el('div', { className: 'jt-poster' })));

                const query = el('input', { type: 'search', className: 'emby-input', value: item.Query, title: 'YouTube search words' });
                const find = button('Find themes', 'button-submit');
                const results = el('div');
                const keywords = el('div', { className: 'jt-row jt-keywords' }, el('span', { className: 'jt-muted', textContent: 'Try:' }),
                    ...KEYWORDS.map(k => {
                        const b = button(k);
                        b.addEventListener('click', () => {
                            query.value = withKeyword(query.value, k);
                            search();
                        });
                        return b;
                    }));
                const body = el('div', { className: 'jt-body' },
                    el('h3', { className: 'jt-title' }, el('a', { href: '#/details?id=' + item.Id, textContent: label(item) })),
                    el('div', { className: 'jt-muted', textContent: kinds[item.Type] + (item.Type === 'Collection' ? ', plays on the collection page' : '') + (item.HasTheme ? ', has a theme' : '') }),
                    el('div', { className: 'jt-row jt-search' }, query, find),
                    keywords,
                    results);

                async function search() {
                    find.disabled = true;
                    find.textContent = 'Searching...';
                    if (current && results.contains(current.row)) {
                        stop();
                    }
                    results.replaceChildren(el('p', { className: 'jt-message jt-muted', textContent: 'Searching YouTube...' }));
                    try {
                        const found = await ApiClient.getJSON(api('Candidates/' + item.Id, { query: query.value }));
                        results.replaceChildren(...(found.length
                            ? found.map((c, i) => result(item, c, i === 0, body))
                            : [el('p', { className: 'jt-message', textContent: 'No results. Try other words, for example the composer or "opening".' })]));
                    } catch (e) {
                        results.replaceChildren(el('p', { className: 'jt-message', textContent: 'Search failed. YouTube may be unreachable or changed; the Jellyfin log has details.' }));
                    }
                    find.disabled = false;
                    find.textContent = 'Search again';
                }

                find.addEventListener('click', search);
                query.addEventListener('keydown', e => {
                    if (e.key === 'Enter') {
                        search();
                    }
                });

                return el('div', { className: 'jt-card' }, poster, body);
            }

            function result(item, video, best, body) {
                const play = button('Play', 'jt-play');
                const use = button(item.HasTheme ? 'Replace with this' : 'Use this', 'jt-use');
                const note = el('div', { className: 'jt-muted' });
                const info = el('div', { className: 'jt-info' },
                    el('div', { textContent: video.Title, title: video.Title }, ...(best ? [el('span', { className: 'jt-badge', textContent: 'Best match' })] : [])),
                    el('div', { className: 'jt-muted', textContent: video.Author + (video.Duration ? ', ' + clock(video.Duration) : '') }),
                    note);
                const row = el('div', { className: 'jt-result' }, play, info, use);

                play.addEventListener('click', () => {
                    if (current && current.row === row) {
                        stop();
                        return;
                    }
                    stop();
                    current = { button: play, row, note };
                    note.textContent = '';
                    row.classList.add('jt-playing');
                    play.textContent = 'Loading...';
                    // <audio> can't send auth headers, so the token goes in the query string.
                    // Jellyfin 12 accepts it as ApiKey; the older api_key spelling is rejected with 401.
                    player.src = api('Preview/' + video.Id, { ApiKey: ApiClient.accessToken() });
                    player.play().catch(() => { });
                });

                use.addEventListener('click', async () => {
                    use.disabled = true;
                    use.textContent = 'Saving...';
                    try {
                        const saved = await ApiClient.ajax({ type: 'POST', url: api('Save/' + item.Id, { videoId: video.Id, replace: !!item.HasTheme }), dataType: 'json' });
                        stop();
                        if (scope.value) {
                            item.HasTheme = true;
                        } else {
                            items = items.filter(i => i.Id !== item.Id);
                        }
                        done(item, body, saved && saved.SubmitUrl, video.Duration);
                    } catch (e) {
                        use.disabled = false;
                        use.textContent = 'Save failed, try again';
                    }
                });

                return row;
            }

            // On phones github.com links open in the GitHub app, which drops the pre-filled form fields.
            // These links skip the app: Chrome on Android via an intent, Safari on iOS 17+ via x-safari-https.
            // Desktop browsers get null and just use the normal link.
            function inBrowser(url) {
                const ua = navigator.userAgent;
                if (/Android/i.test(ua)) {
                    return 'intent://' + url.replace(/^https:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
                }
                if (/iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
                    return 'x-safari-' + url;
                }
                return null;
            }

            // GitHub sometimes opens the form without our values (the GitHub mobile app, or after signing in),
            // so show them ready to copy into the two fields.
            function formValues(submitUrl) {
                const params = new URL(submitUrl).searchParams;
                const field = (name, value) => {
                    const input = el('input', { type: 'text', className: 'emby-input', value, readOnly: true });
                    const copy = button('Copy');
                    copy.addEventListener('click', async () => {
                        try {
                            await navigator.clipboard.writeText(value);
                        } catch (e) {
                            // No clipboard API over plain http; the old way still works there.
                            input.select();
                            document.execCommand('copy');
                        }
                        copy.textContent = 'Copied';
                    });
                    input.addEventListener('focus', () => input.select());
                    return el('div', { className: 'jt-message' }, el('div', { className: 'jt-muted', textContent: name }), el('div', { className: 'jt-row' }, input, copy));
                };
                return el('div', {},
                    el('p', { className: 'jt-message jt-muted', textContent: 'Form opened empty? Paste these into the two fields, then press Create.' }),
                    field('Database URL', params.get('database_url')),
                    field('YouTube Theme Song Video URL', params.get('youtube_theme_url')));
            }

            // After saving: confirm, offer sharing the pick with ThemerrDB, and let the user remove the card.
            function done(item, body, submitUrl, seconds) {
                const close = button('Done');
                close.addEventListener('click', () => body.parentElement.remove());
                const actions = el('div', { className: 'jt-row' });
                let extra = '';
                const children = [
                    el('h3', { className: 'jt-title', textContent: label(item) }),
                    el('p', { className: 'jt-message', textContent: 'Saved. This theme now plays for ' + label(item) + '.' })
                ];
                if (submitUrl) {
                    // ThemerrDB's theme guidelines: 0:20 to 5:00, audible early, not age or region locked, not a fan edit or trailer.
                    const guidelines = el('a', { href: 'https://github.com/LizardByte/ThemerrDB/blob/master/docs/themeGuidelines.md', target: '_blank', rel: 'noopener', textContent: 'theme guidelines' });
                    children.push(el('p', { className: 'jt-message jt-muted' },
                        'Sure it is the right one? Submit it to ThemerrDB so every Themerr and JellyTheme user gets it automatically. ',
                        'This opens their request form on GitHub with the TMDB link and YouTube link filled in; check it and press Create. It needs a free GitHub account. ',
                        'Their reviewers follow the ', guidelines, ': the official theme, not a cover, trailer or movie scene, and no age or region lock.'));
                    if (seconds && (seconds < 20 || seconds > 300)) {
                        children.push(el('p', { className: 'jt-message', textContent: 'Note: this video is ' + clock(seconds) + ' long. ThemerrDB prefers themes between 0:20 and 5:00, so it may be turned down.' }));
                    }
                    // App-switching links can't open in a new tab, so only the normal link gets one.
                    const link = (href, text, primary) => el('a', { href, target: href.startsWith('https:') ? '_blank' : '', rel: 'noopener', className: 'raised emby-button' + (primary ? ' button-submit' : ''), textContent: text, style: 'text-decoration:none' });
                    const browser = inBrowser(submitUrl);
                    if (browser) {
                        actions.append(link(browser, 'Submit in browser', true), link(submitUrl, 'Submit in GitHub app', false), close);
                    } else {
                        actions.append(link(submitUrl, 'Submit to ThemerrDB', true), close);
                    }
                    extra = formValues(submitUrl);
                } else {
                    children.push(el('p', { className: 'jt-message jt-muted', textContent: 'This item has no TMDB id, so it cannot be submitted to ThemerrDB.' }));
                    actions.append(close);
                }
                actions.style.marginTop = '.6em';
                body.replaceChildren(...children, actions, extra);
                if (!scope.value) {
                    status.textContent = needed(items.length);
                }
            }

            filter.addEventListener('input', () => {
                limit = PAGE_SIZE;
                render();
            });
            [type, sort].forEach(select => select.addEventListener('change', () => {
                limit = PAGE_SIZE;
                render();
            }));
            // Appends instead of re-rendering, so open search results stay put.
            more.addEventListener('click', () => {
                const shown = visible();
                list.append(...shown.slice(limit, limit + PAGE_SIZE).map(card));
                limit += PAGE_SIZE;
                updateMore(shown.length);
            });
            page.addEventListener('pagehide', stop);
            // #/configurationpage?name=JellyTheme&item=<id> opens on one movie, show or collection, theme or not.
            function linkedItem() {
                return new URLSearchParams(location.hash.split('?')[1] || '').get('item');
            }

            async function load() {
                status.textContent = 'Loading...';
                const linked = linkedItem();
                if (linked) {
                    scope.value = 'all';
                }
                try {
                    items = await ApiClient.getJSON(api('Missing', scope.value ? { all: true } : undefined));
                    limit = PAGE_SIZE;
                    const match = linked && items.find(i => i.Id.replace(/-/g, '') === linked.replace(/-/g, '').toLowerCase());
                    filter.value = match ? match.Name : filter.value;
                    render();
                } catch (e) {
                    status.textContent = 'Could not load the list. Only administrators can use this page.';
                }
            }

            scope.addEventListener('change', load);
            page.addEventListener('pageshow', load);
        })();
    </script>
</div>
</body>
</html>
